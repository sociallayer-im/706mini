        - article [ref=f1e70]:
          - heading "图标与媒体" [level=3] [ref=f1e71]
          - paragraph [ref=f1e72]: 使用仓库原始线稿图标，禁止emoji补装饰。头像圆形，活动图保留3:4裁切窗口；大图阅读保持原比例。本系统采用系统字体，无额外字体下载，品牌名称是文字而非仿造标志。
        - article [ref=f1e73]:
          - heading "状态与动效" [level=3] [ref=f1e74]
          - paragraph [ref=f1e75]: 按压仅以140ms降低可见面透明度；加载旋转800ms。遵循减少动态偏好。加载拦重复，错误保留内容。状态同时使用文字，焦点环为深色实线。弹层Esc返回，忙碌时锁关闭。
