          - paragraph [ref=f6e69]: 375px基准下，页边16px、区块28px，内容角16px、图片12px、弹层24px。窄屏自然换行，长文不缩小字号。尺寸由角色选择，避免调用页面任意覆盖组件几何。
        - article [ref=f6e70]:
          - heading "图标与媒体" [level=3] [ref=f6e71]
          - paragraph [ref=f6e72]: 使用仓库原始线稿图标，禁止emoji补装饰。头像圆形，活动图保留3:4裁切窗口；大图阅读保持原比例。本系统采用系统字体，无额外字体下载，品牌名称是文字而非仿造标志。
        - article [ref=f6e73]:
          - heading "状态与动效" [level=3] [ref=f6e74]
          - paragraph [ref=f6e75]: 按压仅以140ms降低可见面透明度；加载旋转800ms。遵循减少动态偏好。加载拦重复，错误保留内容。状态同时使用文字，焦点环为深色实线。弹层Esc返回，忙碌时锁关闭。
