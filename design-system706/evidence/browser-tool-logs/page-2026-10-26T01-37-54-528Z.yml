          - paragraph [ref=f7e66]: 正文用 typeBody / 1.7 行高；人名与栏目600字重，活动标题700。系统文案可中英文，用户内容保持原文。保留“待审核”“待付款”“已确认”的业务区别。
        - article [ref=f7e67]:
          - heading "布局与圆角" [level=3] [ref=f7e68]
          - paragraph [ref=f7e69]: 375px基准下，页边16px、区块28px，内容角16px、图片12px、弹层24px。窄屏自然换行，长文不缩小字号。尺寸由角色选择，避免调用页面任意覆盖组件几何。
        - article [ref=f7e70]:
          - heading "图标与媒体" [level=3] [ref=f7e71]
          - paragraph [ref=f7e72]: 使用仓库原始线稿图标，禁止emoji补装饰。头像圆形，活动图保留3:4裁切窗口；大图阅读保持原比例。本系统采用系统字体，无额外字体下载，品牌名称是文字而非仿造标志。
        - article [ref=f7e73]:
          - heading "状态与动效" [level=3] [ref=f7e74]
          - paragraph [ref=f7e75]: 按压仅以140ms降低可见面透明度；加载旋转800ms。遵循减少动态偏好。加载拦重复，错误保留内容。状态同时使用文字，焦点环为深色实线。弹层Esc返回，忙碌时锁关闭。
